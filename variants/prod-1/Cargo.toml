[package]
name = "prod-1"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"
exclude = ["README.md"]

[package.metadata.build-variant.image-features]
grub-set-private-var = true
xfs-data-partition = true
uefi-secure-boot = true
systemd-networkd = true
erofs-root-partition = true
external-kmod-development = false
encrypted-storage = true
in-place-updates = false

[package.metadata.build-variant]
# Override platform to "aws" so we get AWS platform packages, while keeping
# the variant name as "prod-1" for the RPM identity contract.
platform = "aws"
kernel-parameters = [
    "console=tty0",
    "console=ttyS0,115200n8",
    "crashkernel=2G-:256M",
    "net.ifnames=0",
    "netdog.default-interface=eth0:dhcp4,dhcp6?",
    "quiet",
]
included-packages = [
    "release",
    "kernel-6.18",
    "containerd-2.2",
    "systemd-257",
    "nftables",
    "whippet",
    "docker-cli-29",
    "docker-engine-29",
    "docker-init",
    "login",
    "iputils",
    "strace",
    "chrony-tools",
]

[lib]
path = "../variants.rs"

[build-dependencies]
settings-defaults = { path = "../../packages/settings-defaults" }
settings-plugins = { path = "../../packages/settings-plugins" }
settings-migrations = { path = "../../packages/settings-migrations" }
