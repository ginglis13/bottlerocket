# ECS
[services.ecs]
restart-commands = ["/bin/systemctl try-reload-or-restart ecs.service"]
configuration-files = ["ecs-config"]

[configuration-files.ecs-config]
path = "/etc/systemd/system/ecs.service.d/10-base.conf"
template-path = "/usr/share/templates/ecs-base-conf"

[metadata.settings.ecs]
affected-services = ["ecs"]

[settings.ecs]
allow-privileged-containers = false
image-pull-behavior = "default"
logging-drivers = ["json-file", "awslogs", "none"]
loglevel = "info"

# Metrics
[settings.metrics]
service-checks = ["apiserver", "chronyd", "containerd", "host-containerd", "docker", "ecs"]

# Network
[metadata.settings.network]
affected-services = ["containerd", "docker", "ecs", "host-containerd", "host-containers", "updog"]

# Image registry credentials
[metadata.settings.container-registry.credentials]
affected-services = ["ecs", "host-containers", "bootstrap-containers"]

# Container runtime - image verification
[services.image-verification]
configuration-files = [
  "image-verification-toml",
  "notation-trust-policy-json",
]
# Reload if we disable image verification
restart-commands = ["/bin/systemctl try-restart containerd.service"]

[metadata.settings.image-verifier-plugins]
affected-services = ["image-verification"]

[configuration-files.image-verification-toml]
path = "/etc/containerd/config.d/002-image-verification-plugins.toml"
template-path = "/usr/share/templates/image-verification-toml"

[configuration-files.notation-trust-policy-json]
path = "/etc/notation/trustpolicy.json"
template-path = "/usr/share/templates/notation-trust-policy-json"

